name: CI

# Runs on every push and pull request so a broken build or a failing test is
# caught before it reaches the robot. Per the team's engineering practices, a
# green build is a *necessary* gate -- it is not proof that a mechanism works.
# On-robot verification by a named human is still required.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: ['17']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GlitchLib is a git submodule and is REQUIRED to compile: build.gradle
          # adds GlitchLib/Glitch/Lib/{main,test} to the source sets, so the
          # robot's unit tests depend on library sources being present.
          submodules: recursive

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew build --console=plain --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/test/
          retention-days: 14

  # Cheap, fast signal that does not need a JDK toolchain or the submodule.
  json-lint:
    name: Validate JSON (Elastic layout, PathPlanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse deploy JSON
        run: |
          status=0
          while IFS= read -r f; do
            if python3 -m json.tool "$f" > /dev/null; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              status=1
            fi
          done < <(find src/main/deploy -name '*.json')
          exit $status
